name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # End-to-end against the mock: two runs, second one must find changes.
      - run: bun run demo
      - run: grep -q 'class="change"' out-demo/dashboard.html
